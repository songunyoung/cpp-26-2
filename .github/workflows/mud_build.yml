name: Run mud_actions_test

on:
  push:
    paths:
      - 'practice/week13/actions_test/**'
      - '.github/workflows/mud_build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-example:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build and run
        shell: msys2 {0}
        working-directory: practice/week13/actions_test
        run: |
          set -e
          g++ -std=c++17 -Wall -Wextra -static main.cpp user.cpp -o game.exe
          ./game.exe

      - uses: actions/upload-artifact@v7
        with:
          name: actions-test-windows
          path: practice/week13/actions_test/game.exe
          if-no-files-found: error